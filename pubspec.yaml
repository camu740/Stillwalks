name: stillwalks
description: A digital wellbeing and fitness idle game where you collect creatures by keeping your phone locked and walking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any  # Let flutter_localizations manage the version
  
  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # State Management
  provider: ^6.1.1
  
  # Sensors & Permissions
  pedometer: ^4.0.1
  permission_handler: ^11.0.1
  health: ^13.3.1  # Google Fit / Health Connect integration
  
  # Storage & Preferences
  shared_preferences: ^2.2.2
  
  # App Info
  package_info_plus: ^8.0.0
  
  # UI
  cupertino_icons: ^1.0.6
  home_widget: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true  # Enable l10n code generation
  
  # Assets
  assets:
    - assets/creatures/
    - assets/ui/
    - assets/animations/
  
  # Fonts (opcional para futuras mejoras)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
